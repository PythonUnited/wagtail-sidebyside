name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing: add
# this repository and workflow as a trusted publisher in the PyPI project.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@v1.14.3
