[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wagtail-sidebyside"
version = "0.1.0"
description = "Translate Wagtail pages side by side: one main language, translations next to the source, optional AI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PythonUnited" }]
requires-python = ">=3.12"
dependencies = ["wagtail>=8.1,<9"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Wagtail",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

[project.optional-dependencies]
claude = ["anthropic>=2.9"]

[project.urls]
Homepage = "https://github.com/PythonUnited/wagtail-sidebyside"
Issues = "https://github.com/PythonUnited/wagtail-sidebyside/issues"
Changelog = "https://github.com/PythonUnited/wagtail-sidebyside/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "anthropic>=2.9",
    "pytest>=9",
    "pytest-django>=4.14",
    "ruff>=0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wagtail_sidebyside"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
